<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do Liste</title>
<meta name="description" content="Aufgaben mit Person, Priorität und Enddatum — bearbeiten, wieder öffnen, importieren und exportieren.">
<meta name="theme-color" content="#f3eee4">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect fill=%22%231c1814%22 width=%2232%22 height=%2232%22/%3E%3Cpath fill=%22none%22 stroke=%22%23e8d9c0%22 stroke-width=%221.4%22 d=%22M8 16 H24 M16 8 V24%22/%3E%3Cpath fill=%22none%22 stroke=%22%239c3424%22 stroke-width=%221.8%22 d=%22M10 16 L14 20 L22 12%22/%3E%3C/svg%3E">
<style>
:root {
  --paper: #f3eee4;
  --paper-2: #e9e1d2;
  --paper-3: #dfd5c4;
  --ink: #1c1814;
  --muted: #5e564d;
  --rule: #d2c8b8;
  --oxide: #9c3424;
  --oxide-soft: rgba(156, 52, 36, 0.11);
  --slate: #2a5564;
  --ochre: #c4a35a;
  --good: #2c6a4a;
  --hit: rgba(196, 163, 90, 0.32);
  --shadow: 0 18px 50px rgba(28, 24, 20, 0.18);
  --header-bg: #e9e1d2;
  --header-text: #5e564d;
  --glow-1: rgba(156, 52, 36, 0.05);
  --glow-2: rgba(42, 85, 100, 0.045);
  --serif: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --r: 12px;
}
html[data-theme="light"] { color-scheme: light; }
html[data-theme="dark"] {
  --paper: #14110e;
  --paper-2: #1d1915;
  --paper-3: #2a241d;
  --ink: #f3eee4;
  --muted: #b3aa9c;
  --rule: #3d362c;
  --oxide: #e07060;
  --oxide-soft: rgba(224, 112, 96, 0.16);
  --slate: #8eb8c8;
  --ochre: #d4b56c;
  --good: #7dba96;
  --hit: rgba(212, 181, 108, 0.22);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --header-bg: #1d1915;
  --header-text: #f3eee4;
  --glow-1: rgba(224, 112, 96, 0.08);
  --glow-2: rgba(142, 184, 200, 0.06);
  color-scheme: dark;
}
html[data-palette="navy"] {
  --paper: #f0f4ff;
  --paper-2: #ffffff;
  --paper-3: #e8ecf8;
  --ink: #08102a;
  --muted: #4a6080;
  --rule: #bfcfe8;
  --oxide: #2060df;
  --oxide-soft: #dce6ff;
  --slate: #2060df;
  --ochre: #d97706;
  --good: #059669;
  --hit: rgba(32, 96, 223, 0.18);
  --shadow: 0 18px 50px rgba(8, 16, 42, 0.18);
  --header-bg: #08102a;
  --header-text: #ffffff;
  --glow-1: rgba(74, 148, 255, 0.08);
  --glow-2: rgba(32, 96, 223, 0.06);
}
html[data-palette="navy"][data-theme="dark"] {
  --paper: #060c1a;
  --paper-2: #0c1828;
  --paper-3: #102038;
  --ink: #edf2ff;
  --muted: #6e8fb0;
  --rule: #1b2f4a;
  --oxide: #4a94ff;
  --oxide-soft: #0a1e40;
  --slate: #4a94ff;
  --ochre: #fbbf24;
  --good: #34d399;
  --hit: rgba(74, 148, 255, 0.22);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --header-bg: #060c1a;
  --header-text: #edf2ff;
  --glow-1: rgba(74, 148, 255, 0.08);
  --glow-2: rgba(32, 96, 223, 0.06);
}
* { box-sizing: border-box; }
html:focus-within { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html:focus-within { scroll-behavior: auto; }
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 1rem 2.5rem;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse at 0% 0%, var(--glow-1), transparent 42%),
    radial-gradient(ellipse at 100% 8%, var(--glow-2), transparent 40%);
}
.skip {
  position: absolute;
  left: -999px;
  top: 0;
  background: var(--ink);
  color: var(--paper);
  padding: 0.5rem 0.8rem;
  z-index: 80;
}
.skip:focus { left: 0.6rem; top: 0.6rem; }
a { color: var(--oxide); text-underline-offset: 0.16em; }
a:hover { color: var(--ink); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--oxide);
  outline-offset: 2px;
}

.page {
  position: relative;
  z-index: 1;
  width: min(72rem, 100%);
  margin: 0 auto;
}

.mast {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 0 0;
}
.mast-actions { display: flex; gap: 0.4rem; align-items: center; }
.kicker {
  margin: 0;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--oxide);
}
.kicker a { color: inherit; text-decoration: none; }
.kicker a:hover { text-decoration: underline; }
.iconbtn {
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.28rem 0.6rem;
  min-height: 36px;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
}
.iconbtn:hover { border-color: var(--ink); }

.page-head {
  margin: 1.1rem 0 1rem;
}
.page-head h1 {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.03em;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 0.95;
  margin: 0 0 0.25rem;
}
.lede {
  margin: 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 1.1rem;
}
.filename {
  display: block;
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.35rem;
  min-height: 1em;
  font-style: italic;
  font-family: var(--sans);
}

.container {
  background: color-mix(in srgb, var(--paper-2) 72%, var(--paper));
  border: 1px solid var(--rule);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  width: 100%;
  overflow: hidden;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.25rem;
  border-bottom: 1px solid var(--rule);
  gap: 1rem;
  flex-wrap: wrap;
  background: color-mix(in srgb, var(--paper-2) 55%, transparent);
}
.toolbar-left, .toolbar-right {
  display: flex;
  gap: 0.4rem;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  padding: 0.46rem 0.82rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  cursor: pointer;
  font-weight: 500;
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.1s;
  display: inline-flex;
  align-items: center;
  background: transparent;
  color: var(--ink);
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--oxide);
  border-color: var(--oxide);
  color: #fff;
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-success {
  background: var(--good);
  border-color: var(--good);
  color: #fff;
}
.btn-success:hover { filter: brightness(1.05); }
.btn-secondary {
  background: color-mix(in srgb, var(--paper-3) 70%, transparent);
  color: var(--ink);
}
.btn-secondary:hover { border-color: var(--ink); }
.btn-soft-red {
  background: var(--oxide-soft);
  border-color: color-mix(in srgb, var(--oxide) 35%, var(--rule));
  color: var(--oxide);
}
.btn-soft-red:hover { border-color: var(--oxide); }
.btn-row {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
  padding: 0.22rem 0.4rem;
  border-radius: 5px;
  font-size: 0.78rem;
}
.btn-row:hover { color: var(--oxide); background: var(--oxide-soft); border-color: transparent; }
.btn-row-del {
  background: transparent;
  border-color: transparent;
  color: var(--oxide);
  padding: 0.22rem 0.4rem;
  border-radius: 5px;
  font-size: 0.78rem;
}
.btn-row-del:hover { background: var(--oxide-soft); }

.toggle-control {
  display: inline-flex;
  align-items: center;
  gap: 0.38rem;
  font-size: 0.82rem;
  color: var(--ink);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  padding: 0.28rem 0.4rem;
}
.toggle-control input {
  width: 16px;
  height: 16px;
  accent-color: var(--oxide);
  cursor: pointer;
}

.add-form {
  display: flex;
  gap: 0.4rem;
  padding: 0.85rem 1.25rem;
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap;
  align-items: center;
  background: color-mix(in srgb, var(--paper) 70%, var(--paper-2));
}
.add-form input, .add-form select {
  border: 1.5px solid var(--rule);
  border-radius: 8px;
  padding: 0.46rem 0.65rem;
  font-size: 0.875rem;
  outline: none;
  transition: border-color 0.2s;
  background: var(--paper);
  color: var(--ink);
}
.add-form input:focus, .add-form select:focus { border-color: var(--oxide); }
#inp-person { width: 128px; }
#inp-prioA  { width: 74px; }
#inp-prioB  { width: 60px; }
#inp-date   { width: 142px; }
#inp-task   { flex: 1; min-width: 180px; }

.task-list { padding: 0.5rem 1.25rem 1.5rem; overflow-x: auto; }

.task-header, .task-row {
  display: grid;
  grid-template-columns: 28px 128px 62px minmax(260px, 1fr) 110px 40px 112px;
  gap: 0.5rem;
  align-items: center;
  padding: 0.42rem 0.4rem;
}
.task-header.completed-grid, .task-row.completed-grid {
  grid-template-columns: 28px 128px 62px minmax(260px, 1fr) 100px 40px 150px 126px;
}
.task-header {
  border-bottom: 2px solid var(--rule);
  margin: 0.8rem 0 0.3rem;
}
.col-head {
  font-size: 0.73rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color 0.15s;
}
.col-head:hover { color: var(--oxide); }
.col-head.active { color: var(--oxide); }

.task-row { border-radius: 8px; transition: background 0.15s; }
.task-row:hover { background: var(--oxide-soft); }
.task-row.flash {
  background: var(--hit);
  box-shadow: inset 3px 0 0 var(--oxide);
}
.task-row.done .col-text { color: var(--muted); }
.task-row.done .task-title { text-decoration: line-through; }
.task-row.done .col-date { color: var(--muted); }

.task-cb {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--oxide);
  justify-self: center;
}
.task-cb:disabled { cursor: default; opacity: 0.75; }

.prio-badge {
  font-size: 0.67rem;
  font-weight: 800;
  padding: 0.13rem 0.38rem;
  border-radius: 5px;
  display: inline-block;
  text-align: center;
}
.p-high { background: var(--oxide-soft); color: var(--oxide); }
.p-mid  { background: color-mix(in srgb, var(--ochre) 22%, var(--paper)); color: var(--ochre); }
.p-low  { background: color-mix(in srgb, var(--slate) 18%, var(--paper)); color: var(--slate); }
.p-none { background: var(--paper-3); color: var(--muted); }

.col-person { font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-text   { font-size: 0.91rem; }
.col-date   { font-size: 0.82rem; }
.col-completed-date { font-size: 0.82rem; color: var(--muted); }
.col-date.overdue { color: var(--oxide); font-weight: 600; }

.uid-badge, .link-badge {
  display: inline-block;
  border-radius: 5px;
  font-weight: 800;
  font-size: 0.67rem;
  padding: 0.12rem 0.34rem;
  margin-right: 0.35rem;
  vertical-align: middle;
  text-decoration: none;
}
.uid-badge { background: var(--paper-3); color: var(--muted); }
.link-badge {
  background: color-mix(in srgb, var(--slate) 18%, var(--paper));
  color: var(--slate);
  white-space: nowrap;
  margin-left: 0.35rem;
  margin-right: 0;
}

.row-actions {
  display: flex;
  gap: 0.2rem;
  opacity: 0;
  transition: opacity 0.15s;
  min-width: 0;
  flex-wrap: wrap;
}
.task-row:hover .row-actions { opacity: 1; }
.completed-grid .row-actions { max-width: 150px; }
.completed-grid .btn-row, .completed-grid .btn-row-del { padding: 0.18rem 0.32rem; font-size: 0.72rem; }

.completed-section {
  border-top: 1px solid var(--rule);
  margin-top: 1rem;
  padding-top: 0.7rem;
}
.completed-section summary {
  cursor: pointer;
  user-select: none;
  color: var(--muted);
  font-size: 0.86rem;
  font-weight: 700;
  padding: 0.35rem 0.4rem;
  border-radius: 8px;
}
.completed-section summary:hover { color: var(--oxide); background: var(--oxide-soft); }
.reopen-chain {
  border-left: 2px solid color-mix(in srgb, var(--slate) 40%, var(--rule));
  margin: 0.45rem 0 0.2rem 0.35rem;
  padding-left: 0.45rem;
}
.reopen-chain summary {
  color: var(--slate);
  font-size: 0.78rem;
  font-weight: 800;
  padding: 0.28rem 0.35rem;
  border-radius: 6px;
}
.reopen-chain summary:hover {
  background: color-mix(in srgb, var(--slate) 12%, var(--paper));
  color: var(--slate);
}
.chain-row .col-text { position: relative; }
.chain-child .col-text { padding-left: 1rem; }
.chain-child .col-text::before {
  content: "";
  position: absolute;
  left: 0.1rem;
  top: 0.72rem;
  width: 0.45rem;
  border-top: 2px solid color-mix(in srgb, var(--slate) 45%, var(--rule));
}

@media (max-width: 860px) {
  body { padding: 0 0 2rem; }
  .page { width: 100%; }
  .mast, .page-head { padding-left: 1rem; padding-right: 1rem; }
  .page-head { margin-left: 0; }
  .container { border-radius: 0; border-left: 0; border-right: 0; }
  .toolbar { flex-wrap: wrap; align-items: flex-start; }
  .add-form { padding: 0.8rem 1rem; }
  #inp-person, #inp-prioA, #inp-prioB, #inp-date { width: auto; flex: 1 1 120px; }
  #inp-task { flex-basis: 100%; }
  .task-list { padding: 0.5rem 1rem 1rem; overflow-x: visible; }
  .task-header { display: none; }
  .task-row, .task-row.completed-grid {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.35rem 0.75rem;
    align-items: start;
    border-bottom: 1px solid var(--rule);
    padding: 0.7rem 0.2rem;
  }
  .col-person, .col-text { grid-column: 1 / -1; white-space: normal; }
  .col-date, .col-completed-date { color: var(--muted); }
  .task-cb { grid-column: 2; grid-row: 3; }
  .row-actions { grid-column: 1 / -1; opacity: 1; max-width: none; }
  .completed-grid .row-actions { max-width: none; }
  .select-col { display: none; }
  .search-drawer input { padding: 0.55rem 1rem; }
}

.edit-form {
  display: flex;
  gap: 0.38rem;
  padding: 0.5rem 0.45rem;
  background: var(--oxide-soft);
  border-radius: 8px;
  margin: 0.12rem 0;
  flex-wrap: wrap;
  align-items: center;
}
.edit-form input, .edit-form select {
  border: 1.5px solid var(--rule);
  border-radius: 6px;
  padding: 0.36rem 0.5rem;
  font-size: 0.85rem;
  outline: none;
  background: var(--paper);
  color: var(--ink);
}
.edit-form input:focus, .edit-form select:focus { border-color: var(--oxide); }
.ef-person { width: 122px; }
.ef-prioA  { width: 70px; }
.ef-prioB  { width: 58px; }
.ef-date   { width: 140px; }
.ef-text   { flex: 1; min-width: 160px; }

.empty-msg {
  text-align: center;
  color: var(--muted);
  padding: 2.5rem 1rem;
  font-size: 0.93rem;
  line-height: 1.9;
}

.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--ink);
  color: var(--paper);
  padding: 0.6rem 1.1rem;
  border-radius: 10px;
  font-size: 0.84rem;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s;
  pointer-events: none;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateY(0); }

.search-drawer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease, padding 0.25s ease;
  background: color-mix(in srgb, var(--paper) 70%, var(--paper-2));
  border-bottom: 1px solid transparent;
}
.search-drawer.open {
  max-height: 52px;
  border-bottom-color: var(--rule);
}
.search-drawer input {
  display: block;
  width: 100%;
  border: none;
  outline: none;
  padding: 0.65rem 1.25rem;
  font-size: 0.9rem;
  background: transparent;
  color: var(--ink);
}
.btn-search.active {
  background: var(--oxide-soft);
  border-color: var(--oxide);
  color: var(--oxide);
}

.bulk-bar {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  padding: 0.45rem 0.4rem;
  background: var(--oxide-soft);
  border-bottom: 1px solid var(--rule);
  font-size: 0.84rem;
  margin-bottom: 0.2rem;
  border-radius: 8px;
}
.bulk-count { color: var(--oxide); font-weight: 700; margin-right: 0.2rem; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 1.5rem 1.8rem;
  max-width: 400px;
  width: 90%;
  color: var(--ink);
}
.modal-box h3 {
  font-family: var(--serif);
  font-size: 1.15rem;
  font-weight: 400;
  margin: 0 0 0.5rem;
  letter-spacing: -0.02em;
}
.modal-box p {
  font-size: 0.87rem;
  color: var(--muted);
  margin: 0 0 1.2rem;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  gap: 0.5rem;
  justify-content: flex-end;
  flex-wrap: wrap;
}
</style>
<script>
(function(){try{var t=localStorage.getItem("supervised-info.theme");var p=localStorage.getItem("supervised-info.palette");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p==="vintage"||p==="navy")document.documentElement.setAttribute("data-palette",p);}catch(e){}})();
</script>
</head>
<body>
<a class="skip" href="#inp-task">Zur Aufgabeneingabe</a>
<div class="page">
  <header class="mast">
    <p class="kicker"><a href="../">supervised-info</a> · 03</p>
    <div class="mast-actions">
      <button type="button" class="iconbtn" id="paletteBtn" aria-pressed="true" title="Farbschema">Blau</button>
      <button type="button" class="iconbtn" id="themeBtn" aria-pressed="false">Dunkel</button>
    </div>
  </header>

  <div class="page-head">
    <h1>To-Do Liste</h1>
    <p class="lede">Person, Priorität, Enddatum</p>
    <span class="filename" id="filename-display"></span>
  </div>

  <div class="container">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="btn-new" class="btn btn-soft-red" type="button">Neue Liste</button>
        <label class="btn btn-secondary" for="md-import">Importieren</label>
        <input type="file" id="md-import" accept=".json,.md,.markdown,.csv" style="display:none">
      </div>
      <div class="toolbar-right">
        <label class="toggle-control" title="Abgeschlossene Aufgaben unten einblenden">
          <input type="checkbox" id="toggle-completed">
          <span>Abgeschlossen einblenden</span>
        </label>
        <button id="btn-export-json" class="btn btn-success" type="button" title="Verlustfreies Format der Wahl">JSON exportieren</button>
        <button id="btn-export-md" class="btn btn-secondary" type="button" title="Menschenlesbare Aufgabenliste">MD exportieren</button>
        <button id="btn-export-csv" class="btn btn-secondary" type="button" title="Tabellenformat für Menschen und Excel">CSV exportieren</button>
        <button id="btn-search" class="btn btn-secondary btn-search" type="button" title="Suchen" style="padding:.46rem .6rem"></button>
      </div>
    </div>

    <div class="search-drawer" id="search-drawer">
      <input type="text" id="inp-filter" placeholder="Person oder Text …" autocomplete="off">
    </div>

    <div class="add-form">
      <input type="text" id="inp-person" placeholder="Person …" autocomplete="off" title="Person / Name">
      <select id="inp-prioA" title="Priorität Buchstabe (A = höchste)">
        <option value="">– Prio</option>
      </select>
      <select id="inp-prioB" title="Unter-Priorität 1–9">
        <option value="">–</option>
      </select>
      <input type="date" id="inp-date" title="Enddatum">
      <input type="text" id="inp-task" placeholder="Neue Aufgabe …" autocomplete="off">
      <button id="btn-add" class="btn btn-primary" type="button">Hinzufügen</button>
    </div>

    <div class="task-list" id="task-list"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="import-modal">
  <div class="modal-box">
    <h3>Liste importieren</h3>
    <p id="import-modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel" type="button">Abbrechen</button>
      <button class="btn btn-secondary" id="modal-append" type="button">Anhängen</button>
      <button class="btn btn-primary" id="modal-replace" type="button">Ersetzen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

// ── State ──────────────────────────────────────────────────────────────────
let tasks            = JSON.parse(localStorage.getItem('todo-v3') || '[]');
let editId           = null;
let sortCol          = 'person';
let sortDir          = 'asc';
let importedFilename = localStorage.getItem('todo-v3-file') || '';
let showCompleted    = localStorage.getItem('todo-v3-show-completed') === 'true';
let completedExpanded = localStorage.getItem('todo-v3-completed-expanded') !== 'false';
let nextUid          = Number(localStorage.getItem('todo-v3-next-uid')) || 1;
let highlightUid     = null;
let collapsedChains  = JSON.parse(localStorage.getItem('todo-v3-collapsed-chains') || '[]');
let filterText       = '';
let searchOpen       = false;
let selectedIds      = new Set();

// ── Icons ──────────────────────────────────────────────────────────────────
const ICON_SEARCH = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;

// ── DOM refs ───────────────────────────────────────────────────────────────
const taskList        = document.getElementById('task-list');
const inpPerson       = document.getElementById('inp-person');
const inpPrioA        = document.getElementById('inp-prioA');
const inpPrioB        = document.getElementById('inp-prioB');
const inpDate         = document.getElementById('inp-date');
const inpTask         = document.getElementById('inp-task');
const btnAdd          = document.getElementById('btn-add');
const btnNew          = document.getElementById('btn-new');
const btnExportJSON   = document.getElementById('btn-export-json');
const btnExportMD     = document.getElementById('btn-export-md');
const btnExportCSV    = document.getElementById('btn-export-csv');
const toggleCompleted = document.getElementById('toggle-completed');
const mdImport        = document.getElementById('md-import');
const filenameDisplay = document.getElementById('filename-display');
const inpFilter       = document.getElementById('inp-filter');
const searchDrawer    = document.getElementById('search-drawer');
const btnSearch       = document.getElementById('btn-search');
const importModal     = document.getElementById('import-modal');

// ── Populate selects ───────────────────────────────────────────────────────
for (let i = 0; i < 26; i++) {
  const l = String.fromCharCode(65 + i);
  inpPrioA.appendChild(Object.assign(document.createElement('option'), {value:l, textContent:l}));
}
for (let i = 1; i <= 9; i++) {
  inpPrioB.appendChild(Object.assign(document.createElement('option'), {value:i, textContent:i}));
}

// ── Sort ───────────────────────────────────────────────────────────────────
function setSort(col) {
  sortDir = sortCol === col ? (sortDir === 'asc' ? 'desc' : 'asc') : 'asc';
  sortCol = col;
  render();
}

function prioCmp(a, b) {
  const pa = (a.prioA || '￿') + (a.prioB || '9');
  const pb = (b.prioA || '￿') + (b.prioB || '9');
  return pa.localeCompare(pb);
}

function getSorted() {
  return [...tasks].sort((a, b) => {
    let cmp = 0;
    switch (sortCol) {
      case 'person':
        cmp = (a.person || '￿').toLowerCase().localeCompare((b.person || '￿').toLowerCase());
        if (!cmp) cmp = prioCmp(a, b);
        break;
      case 'prioA':
        cmp = prioCmp(a, b);
        if (!cmp) cmp = (a.person || '').localeCompare(b.person || '');
        break;
      case 'text':
        cmp = a.text.toLowerCase().localeCompare(b.text.toLowerCase());
        break;
      case 'dueDate':
        cmp = (a.dueDate || '9999').localeCompare(b.dueDate || '9999');
        if (!cmp) cmp = prioCmp(a, b);
        break;
      case 'completed':
        cmp = (a.completed ? 1 : 0) - (b.completed ? 1 : 0);
        if (!cmp) cmp = prioCmp(a, b);
        break;
      case 'completedDate':
        cmp = (a.completedDate || '9999').localeCompare(b.completedDate || '9999');
        if (!cmp) cmp = prioCmp(a, b);
        break;
    }
    return sortDir === 'asc' ? cmp : -cmp;
  });
}

// group any task list by person → prio order
function groupByPerson(taskList) {
  const sorted = [...taskList].sort((a, b) => {
    const pc = (a.person || '￿').toLowerCase().localeCompare((b.person || '￿').toLowerCase());
    return pc || prioCmp(a, b);
  });
  const map = new Map();
  for (const t of sorted) {
    const k = t.person || '';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  }
  return map;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function prioClass(a) {
  if (!a) return 'p-none';
  const n = a.charCodeAt(0) - 65;
  if (n <= 3) return 'p-high';
  if (n <= 9) return 'p-mid';
  return 'p-low';
}

function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function isOverdue(iso) {
  return !!iso && !iso.startsWith('9999') && iso < new Date().toISOString().slice(0, 10);
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

function nowIso() {
  return new Date().toISOString();
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${dd}.${mm}.${yy} ${hh}:${mi}`;
}

function formatDateTimeUTC(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const dd = String(d.getUTCDate()).padStart(2, '0');
  const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
  const yy = d.getUTCFullYear();
  const hh = String(d.getUTCHours()).padStart(2, '0');
  const mi = String(d.getUTCMinutes()).padStart(2, '0');
  return `${dd}.${mm}.${yy} ${hh}:${mi}`;
}

function parseDMYtoISO(s) {
  const m = (s || '').trim().match(/^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})$/);
  if (!m) return '';
  return `${m[3]}-${m[2]}-${m[1]}T${m[4]}:${m[5]}:00.000Z`;
}

function parseDMYDate(s) {
  const m = (s || '').trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) return '';
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function normalizeTasks(list) {
  const isIso   = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  const toIsoTs = v => {
    if (/^\d{4}-\d{2}-\d{2}T/.test(v || '')) return v;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v || '')) return v + 'T00:00:00.000Z';
    return '';
  };
  const used = new Set();
  let maxUid = 0;
  for (const t of list) {
    const uid = Number(t.uid);
    if (Number.isInteger(uid) && uid > 0 && !used.has(uid)) {
      t.uid = uid;
      used.add(uid);
      maxUid = Math.max(maxUid, uid);
    } else {
      t.uid = '';
    }
    t.reopenedFromUid = Number(t.reopenedFromUid) || '';
    t.reopenedToUid = Number(t.reopenedToUid) || '';
    t.reopenedAt = isIso(t.reopenedAt) ? t.reopenedAt : '';
    t.createdAt = toIsoTs(t.createdAt);
    t.updatedAt = toIsoTs(t.updatedAt);
    t.changedBy = typeof t.changedBy === 'string' ? t.changedBy : '';
  }
  nextUid = Math.max(nextUid, maxUid + 1);
  for (const t of list) {
    if (!t.uid) {
      while (used.has(nextUid)) nextUid++;
      t.uid = nextUid++;
      used.add(t.uid);
    }
  }
  localStorage.setItem('todo-v3-next-uid', String(nextUid));
  return list;
}

function takeUid() {
  const uid = nextUid++;
  localStorage.setItem('todo-v3-next-uid', String(nextUid));
  return uid;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function download(content, filename, type) {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([content], {type})),
    download: filename
  });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

function toggleSearch() {
  searchOpen = !searchOpen;
  searchDrawer.classList.toggle('open', searchOpen);
  btnSearch.classList.toggle('active', searchOpen || filterText.length > 0);
  if (searchOpen) {
    setTimeout(() => inpFilter.focus(), 50);
  } else {
    filterText = '';
    inpFilter.value = '';
    render();
  }
}

// ── Filter ─────────────────────────────────────────────────────────────────
function matchesFilter(t) {
  const q = filterText.toLowerCase();
  return t.text.toLowerCase().includes(q) || (t.person || '').toLowerCase().includes(q);
}

// ── Bulk ───────────────────────────────────────────────────────────────────
function bulkComplete() {
  const today = todayIso(); const now = nowIso(); const n = selectedIds.size;
  tasks.forEach(t => {
    if (selectedIds.has(t.id) && !t.completed) {
      t.completed = true; t.completedDate = today; t.updatedAt = now;
    }
  });
  selectedIds.clear();
  save(`${n} Aufgabe${n !== 1 ? 'n' : ''} erledigt`);
}

function bulkDelete() {
  const n = selectedIds.size;
  if (!confirm(`${n} Aufgabe(n) unwiderruflich löschen?`)) return;
  tasks = tasks.filter(t => !selectedIds.has(t.id));
  selectedIds.clear();
  save(`${n} Aufgaben gelöscht`);
}

// ── Import-Modal ───────────────────────────────────────────────────────────
let _pendingImport = null;

function showImportModal(imported, filename) {
  _pendingImport = { imported, filename };
  document.getElementById('import-modal-text').textContent =
    `Aktuelle Liste (${tasks.length} Aufgabe${tasks.length !== 1 ? 'n' : ''}) und ${imported.length} importierte Aufgaben – ersetzen oder anhängen?`;
  importModal.classList.remove('hidden');
}

function closeImportModal() { importModal.classList.add('hidden'); _pendingImport = null; }

function doImportReplace() {
  const { imported, filename } = _pendingImport;
  tasks = imported; importedFilename = filename; editId = null;
  closeImportModal();
  save(`${imported.length} Aufgaben importiert (ersetzt)`);
}

function doImportAppend() {
  const { imported, filename } = _pendingImport;
  normalizeTasks(imported);
  tasks.push(...imported);
  normalizeTasks(tasks);
  importedFilename = filename; editId = null;
  closeImportModal();
  save(`${imported.length} Aufgaben angehängt`);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  filenameDisplay.textContent = importedFilename;
  toggleCompleted.checked = showCompleted;

  // Suchbutton-Zustand aktualisieren
  btnSearch.innerHTML = ICON_SEARCH;
  btnSearch.classList.toggle('active', filterText.length > 0);

  const allOpen = getSorted().filter(t => !t.completed);
  const allDone = getSorted().filter(t =>  t.completed);
  const open = filterText ? allOpen.filter(matchesFilter) : allOpen;
  const done = filterText ? allDone.filter(matchesFilter) : allDone;


  // Clean up selectedIds that no longer exist or are now completed
  selectedIds = new Set([...selectedIds].filter(id => allOpen.some(t => t.id === id)));

  taskList.innerHTML = '';

  if (!tasks.length) {
    taskList.innerHTML = `<div class="empty-msg">Noch keine Aufgaben vorhanden.<br>Oben eingeben oder eine MD- bzw. CSV-Datei importieren.</div>`;
    return;
  }

  if (open.length) {
    taskList.appendChild(buildTableHeader());

    // Bulk-Bar
    if (selectedIds.size > 0) {
      const bar = document.createElement('div');
      bar.className = 'bulk-bar';
      bar.innerHTML = `<span class="bulk-count">${selectedIds.size} ausgewählt</span>
        <button class="btn btn-success" id="bulk-complete">Erledigen</button>
        <button class="btn btn-soft-red" id="bulk-delete">Löschen</button>`;
      bar.querySelector('#bulk-complete').onclick = bulkComplete;
      bar.querySelector('#bulk-delete').onclick = bulkDelete;
      taskList.appendChild(bar);
    }

    for (const t of open) {
      taskList.appendChild(editId === t.id ? buildEditForm(t) : buildTaskRow(t));
    }
  } else {
    taskList.innerHTML = `<div class="empty-msg">Keine offenen Aufgaben vorhanden.<br>Abgeschlossene Aufgaben kannst du oben einblenden.</div>`;
  }

  if (showCompleted) {
    taskList.appendChild(buildCompletedSection(done));
  }
}

function buildTableHeader(showCompletedDate = false) {
  const cols = [
    { key:'person',    label:'Person' },
    { key:'prioA',     label:'Prio' },
    { key:'text',      label:'Aufgabe' },
    { key:'dueDate',   label:'Enddatum' },
    { key:'completed', label:'Erl.' },
  ];
  const div = document.createElement('div');
  div.className = 'task-header' + (showCompletedDate ? ' completed-grid' : '');
  const headerCells = cols.map(c => {
    const arrow = sortCol === c.key ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<span class="col-head${sortCol===c.key?' active':''}" data-col="${c.key}">${esc(c.label)}${arrow}</span>`;
  }).join('');
  const completedDateArrow = sortCol === 'completedDate' ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  const completedDateHead = `<span class="col-head${sortCol==='completedDate'?' active':''}" data-col="completedDate">Geschlossen${completedDateArrow}</span>`;

  const openIds = getSorted().filter(t => !t.completed).map(t => t.id);
  const allSelected = openIds.length > 0 && openIds.every(id => selectedIds.has(id));
  const selectCell = showCompletedDate
    ? `<span class="select-col"></span>`
    : `<span class="select-col"><input type="checkbox" class="task-cb" id="cb-select-all" title="Alle auswählen" ${allSelected ? 'checked' : ''}></span>`;

  div.innerHTML = selectCell + (showCompletedDate
    ? headerCells + '<span></span>' + completedDateHead
    : headerCells + '<span></span>');
  div.querySelectorAll('.col-head').forEach(el =>
    el.addEventListener('click', () => setSort(el.dataset.col))
  );
  const cbAll = div.querySelector('#cb-select-all');
  if (cbAll) cbAll.onchange = () => {
    if (cbAll.checked) openIds.forEach(id => selectedIds.add(id));
    else selectedIds.clear();
    render();
  };
  return div;
}

function buildTaskRow(t, showCompletedDate = false, chainDepth = 0) {
  const prio = (t.prioA || '') + (t.prioB || '');
  const over = !t.completed && isOverdue(t.dueDate);
  const metaTip = [
    t.createdAt ? `Erstellt: ${formatDateTime(t.createdAt)}` : '',
    t.updatedAt ? `Geändert: ${formatDateTime(t.updatedAt)}` : '',
    t.changedBy ? `Von: ${t.changedBy}` : ''
  ].filter(Boolean).join(' | ');
  const reopenInfo = [
    t.reopenedFromUid ? `<span class="link-badge" title="Wiederaufnahme von Aufgabe #${esc(t.reopenedFromUid)}">von #${esc(t.reopenedFromUid)}</span>` : '',
    t.reopenedToUid ? `<span class="link-badge" title="Diese Aufgabe wurde als #${esc(t.reopenedToUid)} wieder geöffnet">reopen #${esc(t.reopenedToUid)}</span>` : ''
  ].join('');
  const completedAction = t.completed && !t.reopenedToUid ? `<button class="btn btn-row">Wieder öffnen</button>` : '';
  const div  = document.createElement('div');
  div.className = 'task-row' + (t.completed ? ' done' : '') + (showCompletedDate ? ' completed-grid' : '') + (chainDepth ? ' chain-row chain-child' : '') + (highlightUid === t.uid ? ' flash' : '');
  div.dataset.uid = t.uid;
  const isSelected = selectedIds.has(t.id);
  const selectCell = showCompletedDate
    ? `<span class="select-col"></span>`
    : `<span class="select-col"><input type="checkbox" class="task-cb select-cb" ${isSelected ? 'checked' : ''} title="Auswählen"></span>`;

  div.innerHTML = `${selectCell}
    <span class="col-person" title="${esc(t.person)}">${esc(t.person || '–')}</span>
    <span><span class="prio-badge ${prioClass(t.prioA)}">${esc(prio || '–')}</span></span>
    <span class="col-text"><span class="uid-badge" title="${esc(metaTip)}">#${esc(t.uid)}</span><span class="task-title">${esc(t.text)}</span>${reopenInfo}</span>
    <span class="col-date${over ? ' overdue' : ''}">${esc(formatDate(t.dueDate))}</span>
    <input type="checkbox" class="task-cb" ${t.completed ? 'checked disabled' : ''} title="${t.completed ? 'Erledigt' : 'Erledigt markieren'}">
    <div class="row-actions">
      <button class="btn btn-row">Bearb.</button>
      ${t.completed ? completedAction : ''}
      <button class="btn btn-row-del">Löschen</button>
    </div>
    ${showCompletedDate ? `<span class="col-completed-date">${esc(formatDate(t.completedDate))}</span>` : ''}`;
  const selCb = div.querySelector('.select-cb');
  if (selCb) selCb.onchange = () => {
    if (selCb.checked) selectedIds.add(t.id); else selectedIds.delete(t.id);
    render();
  };
  const erlCb = div.querySelector('.task-cb:not(.select-cb)');
  if (erlCb) erlCb.onchange = () => toggle(t.id);
  div.querySelectorAll('button')[0].onclick = () => startEdit(t.id);
  const reopenBtn = t.completed && !t.reopenedToUid ? div.querySelectorAll('button')[1] : null;
  if (reopenBtn) reopenBtn.onclick = () => reopenTask(t.id);
  div.querySelector('.btn-row-del').onclick = () => del(t.id);
  return div;
}

function buildCompletedSection(done) {
  const details = document.createElement('details');
  details.className = 'completed-section';
  details.open = completedExpanded;
  details.innerHTML = `<summary>Abgeschlossen (${done.length})</summary>`;
  details.addEventListener('toggle', () => {
    completedExpanded = details.open;
    localStorage.setItem('todo-v3-completed-expanded', completedExpanded ? 'true' : 'false');
  });

  if (!done.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Keine abgeschlossenen Aufgaben vorhanden.';
    details.appendChild(empty);
    return details;
  }

  details.appendChild(buildTableHeader(true));
  for (const chain of buildReopenChains(done)) {
    if (chain.length > 1) {
      details.appendChild(buildReopenChain(chain));
    } else {
      const t = chain[0];
      details.appendChild(editId === t.id ? buildEditForm(t) : buildTaskRow(t, true));
    }
  }
  return details;
}

function buildReopenChains(done) {
  const byUid = new Map(done.map(t => [Number(t.uid), t]));
  const childUids = new Set(done.map(t => Number(t.reopenedFromUid)).filter(Boolean));
  const roots = done.filter(t => !t.reopenedFromUid || !byUid.has(Number(t.reopenedFromUid)));
  const seen = new Set();
  const chains = [];

  for (const root of roots) {
    const chain = [];
    let current = root;
    while (current && !seen.has(current.uid)) {
      chain.push(current);
      seen.add(current.uid);
      current = current.reopenedToUid ? byUid.get(Number(current.reopenedToUid)) : null;
    }
    chains.push(chain);
  }

  for (const t of done) {
    if (!seen.has(t.uid) && !childUids.has(t.uid)) {
      chains.push([t]);
      seen.add(t.uid);
    }
  }
  for (const t of done) {
    if (!seen.has(t.uid)) {
      chains.push([t]);
      seen.add(t.uid);
    }
  }

  return chains;
}

function buildReopenChain(chain) {
  const root = chain[0];
  const key = String(root.uid);
  const details = document.createElement('details');
  details.className = 'reopen-chain';
  details.open = !collapsedChains.includes(key);
  const title = chain.map(t => `#${t.uid}`).join(' → ');
  details.innerHTML = `<summary>Verlauf ${esc(title)} · ${esc(root.text)}</summary>`;
  details.addEventListener('toggle', () => {
    const set = new Set(collapsedChains);
    if (details.open) set.delete(key);
    else set.add(key);
    collapsedChains = [...set];
    localStorage.setItem('todo-v3-collapsed-chains', JSON.stringify(collapsedChains));
  });
  chain.forEach((t, i) => {
    details.appendChild(editId === t.id ? buildEditForm(t) : buildTaskRow(t, true, i));
  });
  return details;
}

function buildEditForm(t) {
  const aOpts = ['<option value="">– Prio</option>',
    ...Array.from({length:26}, (_, i) => {
      const l = String.fromCharCode(65 + i);
      return `<option value="${l}"${t.prioA===l?' selected':''}>${l}</option>`;
    })].join('');
  const bOpts = ['<option value="">–</option>',
    ...Array.from({length:9}, (_, i) => {
      const n = String(i + 1);
      return `<option value="${n}"${t.prioB===n?' selected':''}>${n}</option>`;
    })].join('');

  const div = document.createElement('div');
  div.className = 'edit-form';
  div.innerHTML = `
    <input class="ef-person" type="text" value="${esc(t.person)}" placeholder="Person …">
    <select class="ef-prioA">${aOpts}</select>
    <select class="ef-prioB">${bOpts}</select>
    <input class="ef-text" type="text" value="${esc(t.text)}" placeholder="Aufgabe …">
    <input class="ef-date" type="date" value="${esc(t.dueDate || '')}" title="Enddatum">
    <button class="btn btn-primary">Speichern</button>
    <button class="btn btn-secondary">Abbrechen</button>`;

  const doSave = () => {
    const text = div.querySelector('.ef-text').value.trim();
    if (!text) return;
    const task = tasks.find(x => x.id === t.id);
    if (task) {
      task.person  = div.querySelector('.ef-person').value.trim();
      task.prioA   = div.querySelector('.ef-prioA').value;
      task.prioB   = div.querySelector('.ef-prioB').value;
      task.dueDate = div.querySelector('.ef-date').value;
      task.text    = text;
      task.updatedAt = nowIso();
      task.changedBy = 'TS/NA';
    }
    editId = null;
    save('Aufgabe gespeichert');
  };
  div.querySelectorAll('button')[0].onclick = doSave;
  div.querySelectorAll('button')[1].onclick = () => { editId = null; render(); };
  div.querySelector('.ef-text').addEventListener('keypress', e => { if (e.key === 'Enter') doSave(); });
  return div;
}

// ── CRUD ───────────────────────────────────────────────────────────────────
function save(msg) {
  normalizeTasks(tasks);
  localStorage.setItem('todo-v3', JSON.stringify(tasks));
  localStorage.setItem('todo-v3-file', importedFilename);
  localStorage.setItem('todo-v3-next-uid', String(nextUid));
  render();
  if (msg) toast(msg);
}

function addTask() {
  const text = inpTask.value.trim();
  if (!text) { inpTask.focus(); return; }
  tasks.push({
    id:        Date.now() + Math.random(),
    uid:       takeUid(),
    text,
    completed: false,
    prioA:     inpPrioA.value,
    prioB:     inpPrioB.value,
    dueDate:   inpDate.value,
    person:    inpPerson.value.trim(),
    createdAt: nowIso(),
    updatedAt: nowIso(),
    changedBy: 'TS/NA'
  });
  inpTask.value = '';
  inpTask.focus();
  save('Aufgabe hinzugefügt');
}

function toggle(id) {
  const t = tasks.find(x => x.id === id);
  if (t) {
    t.completed = !t.completed;
    t.completedDate = t.completed ? todayIso() : '';
    t.updatedAt = nowIso();
    save();
  }
}

function reopenTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t || !t.completed || t.reopenedToUid) return;
  if (!confirm(`Aufgabe #${t.uid} bleibt abgeschlossen. Eine neue offene Kopie wird erstellt. Fortfahren?`)) return;
  const reopenedAt = todayIso();
  const copy = {
    ...t,
    id: Date.now() + Math.random(),
    uid: takeUid(),
    completed: false,
    completedDate: '',
    reopenedFromUid: t.uid,
    reopenedToUid: '',
    reopenedAt,
    createdAt: nowIso(),
    updatedAt: nowIso(),
    changedBy: 'TS/NA'
  };
  t.reopenedToUid = copy.uid;
  t.reopenedAt = reopenedAt;
  tasks.push(copy);
  highlightUid = copy.uid;
  save(`#${t.uid} bleibt abgeschlossen, #${copy.uid} wurde neu geöffnet`);
  setTimeout(() => {
    const row = document.querySelector(`[data-uid="${copy.uid}"]`);
    if (row) row.scrollIntoView({block: 'center', behavior: 'smooth'});
  }, 40);
  setTimeout(() => {
    if (highlightUid === copy.uid) {
      highlightUid = null;
      render();
    }
  }, 2600);
}

function del(id) {
  tasks = tasks.filter(x => x.id !== id);
  if (editId === id) editId = null;
  save('Aufgabe gelöscht');
}

function startEdit(id) {
  editId = id;
  render();
  setTimeout(() => { const el = document.querySelector('.ef-text'); if (el) { el.focus(); el.select(); } }, 40);
}

function clearList() {
  if (tasks.length && !confirm(`Alle ${tasks.length} Aufgaben löschen und neu beginnen?`)) return;
  tasks = []; editId = null; importedFilename = ''; nextUid = 1; selectedIds.clear();
  save(); toast('Liste geleert');
}

// ── MD Import / Export ─────────────────────────────────────────────────────
function parseMD(text) {
  const result = [];
  let person = '';
  let inDoneSection = false;
  let lastTask = null;
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    // Neues Format: <!-- #4 | TS/NA | erstellt DD.MM.YYYY HH:MM | geändert DD.MM.YYYY HH:MM [| ...] -->
    const newMeta = line.trim().match(/^<!--\s+#(\d+)\s+\|(.+?)-->$/);
    if (newMeta && lastTask) {
      const parts = newMeta[2].split('|').map(s => s.trim());
      lastTask.uid        = Number(newMeta[1]) || '';
      lastTask.changedBy  = parts[0] === '–' ? '' : (parts[0] || '');
      const crM = (parts[1] || '').match(/^erstellt (.+)$/);
      if (crM) lastTask.createdAt = parseDMYtoISO(crM[1]);
      const upM = (parts[2] || '').match(/^geändert (.+)$/);
      if (upM) lastTask.updatedAt = parseDMYtoISO(upM[1]);
      for (const p of parts.slice(3)) {
        const vonM = p.match(/^von #(\d+) am (.+)$/);
        if (vonM) { lastTask.reopenedFromUid = Number(vonM[1]); lastTask.reopenedAt = parseDMYDate(vonM[2]); }
        const toM = p.match(/^→ #(\d+) am (.+)$/);
        if (toM)  { lastTask.reopenedToUid  = Number(toM[1]);  lastTask.reopenedAt = parseDMYDate(toM[2]); }
      }
      continue;
    }
    // Altes Format (Rückwärtskompatibilität): <!-- todo: uid=N ... -->
    const oldMeta = line.trim().match(/^<!--\s*todo:\s+(.+?)\s*-->$/);
    if (oldMeta && lastTask) {
      const obj = {};
      for (const [, k, v] of oldMeta[1].matchAll(/(\w+)=(\S+)/g)) obj[k] = v;
      lastTask.uid            = Number(obj.uid) || '';
      lastTask.reopenedFromUid = Number(obj.reopenedFrom) || '';
      lastTask.reopenedToUid   = Number(obj.reopenedTo) || '';
      lastTask.reopenedAt     = /^\d{4}-\d{2}-\d{2}$/.test(obj.reopenedAt || '') ? obj.reopenedAt : '';
      lastTask.createdAt      = /^\d{4}-\d{2}-\d{2}T/.test(obj.createdAt || '') ? obj.createdAt : '';
      lastTask.updatedAt      = /^\d{4}-\d{2}-\d{2}T/.test(obj.updatedAt || '') ? obj.updatedAt : '';
      lastTask.changedBy      = obj.changedBy || '';
      continue;
    }
    // ## level-2 headers → person group or Abgeschlossen marker
    const sec2 = line.match(/^##\s+(.*)/);
    if (sec2) {
      const label = sec2[1].trim();
      if (label === 'Abgeschlossen') { inDoneSection = true; person = ''; }
      else { inDoneSection = false; person = label === '(Keine Person)' ? '' : label; }
      continue;
    }
    // ### level-3 headers → person within Abgeschlossen
    const sec3 = line.match(/^###\s+(.*)/);
    if (sec3) {
      const label = sec3[1].trim();
      person = label === '(Keine Person)' ? '' : label;
      continue;
    }
    // - [ ] [A1] Task text (2024-12-31) {2024-12-31}
    const m = line.match(/^- \[([ xX])\] (?:\[([A-Z])([1-9])?\] )?(.+?)(?:\s+\((\d{4}-\d{2}-\d{2})\))?(?:\s+\{(\d{4}-\d{2}-\d{2})\})?$/);
    if (m) {
      lastTask = {
        id:            Date.now() + Math.random(),
        text:          m[4].trim(),
        completed:     m[1] !== ' ',
        prioA:         m[2] || '',
        prioB:         m[3] || '',
        dueDate:       m[5] || '',
        completedDate: m[6] || '',
        person
      };
      result.push(lastTask);
    }
  }
  return normalizeTasks(result);
}

function mdMeta(t) {
  const parts = [
    `#${t.uid}`,
    t.changedBy || '–',
    `erstellt ${t.createdAt ? formatDateTimeUTC(t.createdAt) : '–'}`,
    `geändert ${t.updatedAt ? formatDateTimeUTC(t.updatedAt) : '–'}`
  ];
  if (t.reopenedFromUid) parts.push(`von #${t.reopenedFromUid} am ${formatDate(t.reopenedAt)}`);
  if (t.reopenedToUid)   parts.push(`→ #${t.reopenedToUid} am ${formatDate(t.reopenedAt)}`);
  return `  <!-- ${parts.join(' | ')} -->\n`;
}

function exportMD() {
  if (!tasks.length) { toast('Keine Aufgaben vorhanden'); return; }
  normalizeTasks(tasks);
  const ts   = new Date().toLocaleString('de-DE');
  let md     = `# To-Do Liste\nExportiert am: ${ts}\n`;
  const open = tasks.filter(t => !t.completed);
  const done = tasks.filter(t =>  t.completed);

  for (const [person, group] of groupByPerson(open)) {
    md += `\n## ${person || '(Keine Person)'}\n\n`;
    for (const t of group) {
      const prio = t.prioA ? `[${t.prioA}${t.prioB || ''}] ` : '';
      const due  = t.dueDate ? ` (${t.dueDate})` : '';
      md += `- [ ] ${prio}${t.text}${due}\n`;
      md += mdMeta(t);
    }
  }

  if (done.length) {
    md += `\n---\n\n## Abgeschlossen\n`;
    for (const [person, group] of groupByPerson(done)) {
      md += `\n### ${person || '(Keine Person)'}\n\n`;
      for (const t of group) {
        const prio  = t.prioA ? `[${t.prioA}${t.prioB || ''}] ` : '';
        const due   = t.dueDate      ? ` (${t.dueDate})`      : '';
        const compl = t.completedDate ? ` {${t.completedDate}}` : '';
        md += `- [x] ${prio}${t.text}${due}${compl}\n`;
        md += mdMeta(t);
      }
    }
  }

  download(md, 'todo-liste.md', 'text/markdown;charset=utf-8');
  toast('Markdown exportiert');
}

// ── CSV Import / Export ────────────────────────────────────────────────────
function splitCSVLine(line, sep) {
  const cols = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === sep) { cols.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  cols.push(cur);
  return cols;
}

function parseCSV(text) {
  const result = [];
  const lines  = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return result;
  const sep = lines[0].includes(';') ? ';' : ',';
  for (const line of lines.slice(1)) {
    const cols = splitCSVLine(line, sep).map(c => c.trim());
    const [person, prioA, prioB, text, dueDate, completedDate, uid, reopenedFromUid, reopenedToUid, reopenedAt, createdAt, updatedAt, changedBy] = cols;
    if (!text || person.startsWith('##')) continue;
    const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v);
    result.push({
      id:            Date.now() + Math.random(),
      uid:           Number(uid) || '',
      text,
      completed:     isDate(completedDate),
      prioA:         /^[A-Z]$/.test(prioA) ? prioA : '',
      prioB:         /^[1-9]$/.test(prioB) ? prioB : '',
      dueDate:       isDate(dueDate) ? dueDate : '',
      completedDate: isDate(completedDate) ? completedDate : '',
      reopenedFromUid: Number(reopenedFromUid) || '',
      reopenedToUid:   Number(reopenedToUid) || '',
      reopenedAt:      isDate(reopenedAt) ? reopenedAt : '',
      createdAt:     /^\d{4}-\d{2}-\d{2}T/.test(createdAt || '') ? createdAt : parseDMYtoISO(createdAt),
      updatedAt:     /^\d{4}-\d{2}-\d{2}T/.test(updatedAt || '') ? updatedAt : parseDMYtoISO(updatedAt),
      changedBy:     changedBy || '',
      person:        person || ''
    });
  }
  return normalizeTasks(result);
}

function exportCSV() {
  if (!tasks.length) { toast('Keine Aufgaben vorhanden'); return; }
  normalizeTasks(tasks);
  const open = tasks.filter(t => !t.completed);
  const done = tasks.filter(t =>  t.completed);
  const rows = [['Person', 'Prio A', 'Prio B', 'Aufgabe', 'Enddatum', 'Abgeschlossen am', 'UID', 'Reopened From UID', 'Reopened To UID', 'Reopened At', 'Erstellt am', 'Geändert am', 'Geändert von']];

  for (const [person, group] of groupByPerson(open)) {
    for (const t of group) {
      rows.push([person, t.prioA, t.prioB, t.text, t.dueDate || '', '', t.uid, t.reopenedFromUid || '', t.reopenedToUid || '', t.reopenedAt || '', formatDateTimeUTC(t.createdAt), formatDateTimeUTC(t.updatedAt), t.changedBy || '']);
    }
  }
  if (done.length) {
    rows.push(['## Abgeschlossen', '', '', '', '', '', '', '', '', '', '', '', '']);
    for (const [person, group] of groupByPerson(done)) {
      for (const t of group) {
        rows.push([person, t.prioA, t.prioB, t.text, t.dueDate || '', t.completedDate || '', t.uid, t.reopenedFromUid || '', t.reopenedToUid || '', t.reopenedAt || '', formatDateTimeUTC(t.createdAt), formatDateTimeUTC(t.updatedAt), t.changedBy || '']);
      }
    }
  }
  const csv = '﻿' + rows.map(r =>
    r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')
  ).join('\r\n');
  download(csv, 'todo-liste.csv', 'text/csv;charset=utf-8');
  toast('CSV exportiert');
}

// ── JSON Import / Export ───────────────────────────────────────────────────
function parseJSON(text) {
  const data = JSON.parse(text);
  const list = Array.isArray(data) ? data : data.tasks;
  if (!Array.isArray(list)) return [];
  const isIso   = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  const isIsoTs = v => /^\d{4}-\d{2}-\d{2}T/.test(v || '');
  const imported = normalizeTasks(list.map(t => ({
    id: Date.now() + Math.random(),
    uid: Number(t.uid) || '',
    text: String(t.text || '').trim(),
    completed: !!t.completed,
    prioA: /^[A-Z]$/.test(t.prioA || '') ? t.prioA : '',
    prioB: /^[1-9]$/.test(String(t.prioB || '')) ? String(t.prioB) : '',
    dueDate: isIso(t.dueDate) ? t.dueDate : '',
    completedDate: isIso(t.completedDate) ? t.completedDate : '',
    person: String(t.person || ''),
    reopenedFromUid: Number(t.reopenedFromUid) || '',
    reopenedToUid: Number(t.reopenedToUid) || '',
    reopenedAt: isIso(t.reopenedAt) ? t.reopenedAt : '',
    createdAt: isIsoTs(t.createdAt) ? t.createdAt : '',
    updatedAt: isIsoTs(t.updatedAt) ? t.updatedAt : '',
    changedBy: String(t.changedBy || '')
  })).filter(t => t.text));
  if (data && Number(data.nextUid)) {
    nextUid = Number(data.nextUid);
    localStorage.setItem('todo-v3-next-uid', String(nextUid));
  }
  return imported;
}

function exportJSON() {
  if (!tasks.length) { toast('Keine Aufgaben vorhanden'); return; }
  normalizeTasks(tasks);
  const data = {
    format: 'todo-v3-json',
    exportedAt: new Date().toISOString(),
    nextUid,
    tasks: tasks.map(t => ({
      uid: t.uid,
      text: t.text,
      completed: !!t.completed,
      prioA: t.prioA || '',
      prioB: t.prioB || '',
      dueDate: t.dueDate || '',
      completedDate: t.completedDate || '',
      person: t.person || '',
      reopenedFromUid: t.reopenedFromUid || '',
      reopenedToUid: t.reopenedToUid || '',
      reopenedAt: t.reopenedAt || '',
      createdAt: t.createdAt || '',
      updatedAt: t.updatedAt || '',
      changedBy: t.changedBy || ''
    }))
  };
  download(JSON.stringify(data, null, 2), 'todo-liste.json', 'application/json;charset=utf-8');
  toast('JSON exportiert');
}

// ── File Import ────────────────────────────────────────────────────────────
function importFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const text     = e.target.result.replace(/^﻿/, '');
    const name     = file.name.toLowerCase();
    let imported = [];
    try {
      if (name.endsWith('.json')) imported = parseJSON(text);
      else if (name.endsWith('.csv')) imported = parseCSV(text);
      else imported = parseMD(text);
    } catch (err) {
      toast('Datei konnte nicht importiert werden');
      return;
    }
    if (!imported.length) { toast('Keine Aufgaben gefunden'); return; }
    if (tasks.length) {
      showImportModal(imported, file.name);
    } else {
      tasks = imported; importedFilename = file.name; editId = null;
      save(`${imported.length} Aufgaben importiert`);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Events ─────────────────────────────────────────────────────────────────
btnAdd.onclick        = addTask;
btnNew.onclick        = clearList;
btnExportJSON.onclick = exportJSON;
btnExportMD.onclick   = exportMD;
btnExportCSV.onclick  = exportCSV;
toggleCompleted.onchange = () => {
  showCompleted = toggleCompleted.checked;
  localStorage.setItem('todo-v3-show-completed', showCompleted ? 'true' : 'false');
  render();
};
inpTask.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
mdImport.addEventListener('change', e => {
  if (e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
});
btnSearch.addEventListener('click', toggleSearch);
inpFilter.addEventListener('input', () => {
  filterText = inpFilter.value.trim();
  render();
});
inpFilter.addEventListener('keydown', e => {
  if (e.key === 'Escape') { toggleSearch(); }
});
inpFilter.addEventListener('blur', () => {
  if (!filterText) { searchOpen = false; searchDrawer.classList.remove('open'); btnSearch.classList.remove('active'); }
});
document.getElementById('modal-cancel') .onclick = closeImportModal;
document.getElementById('modal-replace').onclick = doImportReplace;
document.getElementById('modal-append') .onclick = doImportAppend;
importModal.addEventListener('click', e => { if (e.target === importModal) closeImportModal(); });

// ── Init ───────────────────────────────────────────────────────────────────
btnSearch.innerHTML = ICON_SEARCH;
normalizeTasks(tasks);
localStorage.setItem('todo-v3', JSON.stringify(tasks));
localStorage.setItem('todo-v3-next-uid', String(nextUid));
render();

</script>
<script>
(function () {
  var THEME_KEY = "supervised-info.theme";
  var PALETTE_KEY = "supervised-info.palette";
  var html = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  var paletteBtn = document.getElementById("paletteBtn");
  var meta = document.querySelector('meta[name="theme-color"]');
  function chromeColor(t, p) {
    var dark = t === "dark";
    var vintage = p !== "navy";
    if (vintage) return dark ? "#14110e" : "#f3eee4";
    return dark ? "#060c1a" : "#f0f4ff";
  }
  function currentTheme() {
    var t = html.getAttribute("data-theme");
    if (t === "dark" || t === "light") return t;
    try {
      t = localStorage.getItem(THEME_KEY);
      if (t === "dark" || t === "light") return t;
    } catch (e) {}
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function currentPalette() {
    var p = html.getAttribute("data-palette");
    if (p === "vintage" || p === "navy") return p;
    try {
      p = localStorage.getItem(PALETTE_KEY);
      if (p === "vintage" || p === "navy") return p;
    } catch (e) {}
    return "vintage";
  }
  function writeShared(t, p) {
    try {
      localStorage.setItem(THEME_KEY, t);
      localStorage.setItem(PALETTE_KEY, p);
    } catch (e) {}
  }
  function applyTheme(t) {
    html.setAttribute("data-theme", t);
    if (themeBtn) {
      themeBtn.textContent = t === "dark" ? "Hell" : "Dunkel";
      themeBtn.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
    }
    if (meta) meta.setAttribute("content", chromeColor(t, currentPalette()));
    writeShared(t, currentPalette());
  }
  function applyPalette(p) {
    html.setAttribute("data-palette", p);
    if (paletteBtn) {
      paletteBtn.textContent = p === "vintage" ? "Blau" : "Creme";
      paletteBtn.setAttribute("aria-pressed", p === "vintage" ? "true" : "false");
    }
    if (meta) meta.setAttribute("content", chromeColor(currentTheme(), p));
    writeShared(currentTheme(), p);
  }
  applyTheme(currentTheme());
  applyPalette(currentPalette());
  if (themeBtn) themeBtn.addEventListener("click", function () {
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
  });
  if (paletteBtn) paletteBtn.addEventListener("click", function () {
    applyPalette(currentPalette() === "vintage" ? "navy" : "vintage");
  });
})();
</script>
