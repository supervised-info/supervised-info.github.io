}
th.s0, th.s1, th.s2, th.s3 { z-index: 6; }

<a class="skip" href="#search">Zur Suche</a>
<div class="shell">
  <header class="mast">
    <div class="mast-row">
      <p class="kicker"><a href="../">supervised-info</a> · 02</p>
      <div class="mast-actions">
        <button type="button" class="iconbtn" id="filterBtn" aria-controls="rail" aria-expanded="true">Filter</button>
        <button type="button" class="iconbtn" id="themeBtn" aria-pressed="false">Dunkel</button>
      </div>
    </div>
    <h1>Elektroautos, im Vergleich</h1>
    <div class="hero">
      <input type="search" id="search" placeholder="Model 3, Kia, Allrad, NMC…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <p class="hero-meta" id="matchCount" aria-live="polite">Lade Daten…</p>
    </div>
  </header>
  <div class="work" id="work">
    <aside class="rail" id="rail" aria-label="Filter">
      <div class="rail-head">
        <h2>Eingrenzen</h2>
        <button type="button" class="iconbtn" id="closeRail" aria-label="Filter schließen">Schließen</button>
      </div>
      <fieldset>
        <legend>Klasse</legend>
        <div class="chips" id="classChips">
          <button type="button" class="chip" data-class="pkw" aria-pressed="true">Pkw</button>
          <button type="button" class="chip" data-class="camper" aria-pressed="false">Camper</button>
          <button type="button" class="chip" data-class="nutz" aria-pressed="false">Nutzfahrzeug</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>Status</legend>
        <div class="chips" id="statusChips">
          <button type="button" class="chip" data-st="aktuell" aria-pressed="true">Aktuell</button>
          <button type="button" class="chip" data-st="alt" aria-pressed="false">Veraltet / eingestellt</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>Spannen</legend>
        <div id="ranges"></div>
      </fieldset>
      <fieldset>
        <legend>Auswahl</legend>
        <div id="picks"></div>
      </fieldset>
      <fieldset>
        <legend>Ausstattung</legend>
        <div class="toggles" id="toggles"></div>
      </fieldset>
      <button type="button" class="reset" id="resetBtn">Filter zurücksetzen</button>
    </aside>
    <div class="stage">
      <div class="toolbar" id="toolbar"></div>
      <div class="importbar" id="importBar"></div>
      <div class="notice" id="notice" hidden></div>
      <div class="table-scroll" id="scroller">
        <table id="grid">
          <caption>Vergleichstabelle der Elektrofahrzeuge</caption>
          <thead></thead>
          <tbody></tbody>
        </table>
        <p class="empty" id="empty" hidden>Keine Fahrzeuge passen zu Suche und Filter.</p>
      </div>
      <div class="compare" id="compare" hidden></div>
    </div>
  </div>
  <footer class="foot" id="foot">Eigenständige Vergleichsansicht. Datenstand folgt nach dem Laden.</footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-labelledby="sheetTitle" role="dialog" aria-modal="true"></aside>
<script src="./app.js" defer></script>
</body>
</html>
