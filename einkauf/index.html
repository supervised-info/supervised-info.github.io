  justify-content: center;

.scrim {

  z-index: 40;

}
.scrim.open {

.sheet {

  right: 0;

  height: 100dvh;
  width: min(22.5rem, 100%);
  background: var(--paper);

  flex-direction: column;

.sheet.open { transform: translateX(0); }
.sheet[hidden], .scrim[hidden] { display: none !important; }
.sheet-head {

  gap: 0.6rem;
  padding: 0.9rem 1rem 0.7rem;
  border-bottom: 1px solid var(--rule);

  font-weight: 400;
  font-size: 1.45rem;
  margin: 0;
  letter-spacing: -0.02em;
}
.sheet-body {

  padding: 0.9rem 1rem 1.6rem;

  function canon(s) {
    return String(s).toLowerCase()
      .replace(/ä/g, "a")
      .replace(/ö/g, "o")
      .replace(/ü/g, "u")
      .replace(/ß/g, "ss")
      .replace(/ae/g, "a")
      .replace(/oe/g, "o")
      .replace(/ue/g, "u");
  }

  function stripQty(s) {
    return s
      .replace(/[-–—]/g, " ")
      .replace(/\b\d+([.,]\d+)?\s*x\b/g, " ")
      .replace(/\b\d+([.,]\d+)?\s*(kg|g|mg|ml|cl|dl|l|stk|stueck|stuck|packung|packungen|pck|pack)\b/g, " ")
      .replace(/\b\d+([.,]\d+)?\b/g, " ")
      .replace(/\b(kg|g|mg|ml|cl|dl|l|stk|stueck|stuck|packung|packungen|pck|pack|x)\b/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function mappingKey(name) {
    var c = canon(String(name).trim());
    var s = stripQty(c);
    return s || c;
  }

  function guessDept(name) {
    var folded = canon(name);
    var search = stripQty(folded) || folded.trim();
    if (!search) return "sonstiges";

    if (
      search.indexOf("tiefkuhl") !== -1 ||
      /(^|[\s-])tk([\s-]|$)/.test(folded) ||
      /(^|[\s-])tk([\s-]|$)/.test(search)
    ) {
      return "tiefkuehl";
    }
    if (/ice\s*tea/.test(search) || search.indexOf("eistee") !== -1) return "getraenke";
    if (/schorle/.test(search) || /saft$/.test(search) || search === "saft") return "getraenke";
    if (search.indexOf("chips") !== -1) return "suess";
    if (search === "eis" || (/eis$/.test(search) && search.indexOf("eisberg") === -1)) {
      return "tiefkuehl";
    }

    var best = null;
    var bestLen = 0;
    for (var i = 0; i < KW.length; i++) {
      var kw = KW[i];
      if (kw.k.length < bestLen) break;
      var hit = false;
      if (kw.k.length <= 2) {
        hit = new RegExp("(^|[^a-z])" + kw.k + "([^a-z]|$)").test(search);
      } else if (search.indexOf(kw.k) !== -1) {
        hit = true;
      }
      if (hit) {
        best = kw.d;
        bestLen = kw.k.length;
      }
    }
    if (best) return best;
    var mk = mappingKey(name);
    if (state.mappings[mk] && DEPTS[state.mappings[mk]]) return state.mappings[mk];
    return "sonstiges";
  }

  function uid(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function seedStores() {
    return SEEDS.map(function (s) {
      return { id: s.id, name: s.name, layout: s.layout.slice(), builtin: true };
    });
  }

  function orderStores(stores) {
    var byId = {};
    stores.forEach(function (s) { byId[s.id] = s; });
    var out = [];
    SEEDS.forEach(function (seed) {
      if (byId[seed.id]) {
        out.push(byId[seed.id]);
        delete byId[seed.id];
      }
    });
    stores.forEach(function (s) {
      if (byId[s.id]) {
        out.push(s);
        delete byId[s.id];
      }
    });
    return out;
  }

  function sanitizeLayout(layout) {
    var seen = {};
    var out = [];
    (layout || []).forEach(function (id) {
      if (DEPTS[id] && !seen[id]) {
        seen[id] = true;
        out.push(id);
      }
    });
    if (!out.length) out.push("sonstiges");
    return out;
  }

  function load() {
    var fallback = {
      theme: "light",
      currentStoreId: "edeka",
      items: [],
      mappings: {},
      stores: seedStores()
    };
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      var d = JSON.parse(raw);
      var stores = Array.isArray(d.stores) ? d.stores : [];
      stores = stores.map(function (s) {
        if (!s || !s.id || !s.name) return null;
        return {
          id: String(s.id),
          name: String(s.name),
          layout: sanitizeLayout(s.layout),
          builtin: !!s.builtin
        };
      }).filter(Boolean);
      SEEDS.forEach(function (seed) {
        var found = null;
        stores.forEach(function (s) {
          if (s.id === seed.id) found = s;
        });
        if (!found) {
          stores.push({ id: seed.id, name: seed.name, layout: seed.layout.slice(), builtin: true });
        } else {
          found.builtin = true;
        }
      });
      if (!stores.length) stores = seedStores();
      stores = orderStores(stores);
      var items = Array.isArray(d.items) ? d.items : [];
      items = items.map(function (it) {
        if (!it || typeof it.name !== "string") return null;
        var dept = DEPTS[it.dept] ? it.dept : "sonstiges";
        return {
          id: it.id ? String(it.id) : uid("i"),
          name: it.name,
          dept: dept,
          done: !!it.done,
          added: typeof it.added === "number" ? it.added : Date.now()
        };
      }).filter(Boolean);
      var mappings = {};
      if (d.mappings && typeof d.mappings === "object") {
        Object.keys(d.mappings).forEach(function (k) {
          if (DEPTS[d.mappings[k]]) mappings[k] = d.mappings[k];
        });
      }
      var current = String(d.currentStoreId || "edeka");
      var has = stores.some(function (s) { return s.id === current; });
      if (!has) current = stores[0].id;
      return {
        theme: d.theme === "dark" ? "dark" : "light",
        currentStoreId: current,
        items: items,
        mappings: mappings,
        stores: stores
      };
    } catch (e) {
      return fallback;
    }
  }

      }
    });
    if (!used.sonstiges && byDept.sonstiges && byDept.sonstiges.length) {
      groups.push({ id: "sonstiges", items: byDept.sonstiges });
    }
    return groups;
  }

  function addItem(name) {
    name = String(name || "").replace(/\s+/g, " ").trim();
    if (!name) return;
    state.items.push({
      id: uid("i"),
      name: name,
      dept: guessDept(name),
      done: false,
      added: Date.now()
    });
    scheduleSave();
    renderList();
    renderCount();
  }

  function setItemDept(id, dept) {
    if (!DEPTS[dept]) return;
    state.items.forEach(function (it) {
      if (it.id === id) {
        it.dept = dept;
        state.mappings[mappingKey(it.name)] = dept;
      }
    });
    scheduleSave();
    renderList();
  }

  function renameItem(it, newName) {
    newName = String(newName || "").replace(/\s+/g, " ").trim();
    if (!newName) {
      renderList();
      return;
    }
    var oldKey = mappingKey(it.name);
    it.name = newName;
    var newKey = mappingKey(it.name);
    if (newKey !== oldKey) it.dept = guessDept(newName);
    state.mappings[newKey] = it.dept;
    scheduleSave();
    renderList();
    renderCount();
  }

  function startEdit(it, nameEl) {
    var input = document.createElement("input");
    input.type = "text";
    input.className = "name-edit";
    input.value = it.name;
    input.setAttribute("aria-label", "Artikel bearbeiten");
    nameEl.replaceWith(input);
    input.focus();
    input.select();
    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      if (save) renameItem(it, input.value);
      else renderList();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
      } else if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        finish(false);
      }
    });
    input.addEventListener("blur", function () { finish(true); });
  }

  function renderCount() {
    var offen = 0;
    var erledigt = 0;
    state.items.forEach(function (it) {
      if (it.done) erledigt += 1;
      else offen += 1;
    });
    els.count.textContent = offen + " offen, " + erledigt + " erledigt";
  }

  function renderStoreSelect() {
    var cur = state.currentStoreId;
    var keep = els.store.value;
    els.store.textContent = "";
    state.stores.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.name;
      if (s.id === cur) opt.selected = true;
      els.store.appendChild(opt);
    });
    if (keep && keep !== els.store.value) {
      /* re-assert current */
    }
  }

  function renderList() {
    els.list.textContent = "";
    if (!state.items.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Noch nichts auf der Liste.";
      els.list.appendChild(empty);
      return;
    }
    var groups = groupItems();
    groups.forEach(function (g) {
      var sec = document.createElement("section");
      sec.className = "dept";
      var h = document.createElement("h2");
      h.textContent = DEPTS[g.id];
      sec.appendChild(h);
      var ul = document.createElement("ul");
      ul.className = "items";
      g.items.forEach(function (it) {
        ul.appendChild(renderRow(it));
      });
      sec.appendChild(ul);
      els.list.appendChild(sec);
    });
  }

  function renderRow(it) {
    var li = document.createElement("li");
    li.className = "row" + (it.done ? " done" : "");

    var lab = document.createElement("label");
    lab.className = "chk";
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = it.done;
    cb.setAttribute("aria-label", (it.done ? "Erledigt: " : "Offen: ") + it.name);
    cb.addEventListener("change", function () {
      it.done = cb.checked;
      scheduleSave();
      renderList();
      renderCount();
    });
    lab.appendChild(cb);

    var name = document.createElement("button");
    name.type = "button";
    name.className = "name";
    name.textContent = it.name;
    name.title = "Tippen zum Bearbeiten";
    name.addEventListener("click", function () { startEdit(it, name); });

    var sel = document.createElement("select");
    sel.className = "dept-sel";
    sel.setAttribute("aria-label", "Abteilung für " + it.name);
    Object.keys(DEPTS).forEach(function (d) {
      var opt = document.createElement("option");
      opt.value = d;
      opt.textContent = DEPTS[d];
      if (d === it.dept) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () {
      setItemDept(it.id, sel.value);
    });

    var del = document.createElement("button");
    del.type = "button";
    del.className = "iconbtn del";
    del.setAttribute("aria-label", "Löschen");
    del.textContent = "×";
    del.addEventListener("click", function () {
      state.items = state.items.filter(function (x) { return x.id !== it.id; });
      scheduleSave();
      renderList();
      renderCount();
    });

    li.appendChild(lab);
    li.appendChild(name);
    li.appendChild(sel);
    li.appendChild(del);
    return li;
  }

  function setStatus(msg) {
    els.status.textContent = msg || "";
    clearTimeout(statusTimer);
    if (msg) {
      statusTimer = setTimeout(function () {
        els.status.textContent = "";
      }, 2500);
    }
  }

  function toMarkdown() {
    var store = currentStore();
    var groups = groupItems();
    var lines = ["# Einkauf — " + store.name, ""];
    groups.forEach(function (g) {
      lines.push("## " + DEPTS[g.id]);
      g.items.forEach(function (it) {
        lines.push("- [" + (it.done ? "x" : " ") + "] " + it.name);
      });
      lines.push("");
    });
    return lines.join("\n").replace(/\n+$/, "\n");
  }

  function slugify(name) {
    var s = canon(name).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return s || "liste";
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function copyMd() {
    var md = toMarkdown();
    function ok() { setStatus("Kopiert."); }
    function fail() { setStatus("Kopieren fehlgeschlagen."); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(ok).catch(function () {
        if (fallbackCopy(md)) ok();
        else fail();
      });
    } else if (fallbackCopy(md)) {
      ok();
    } else {
      fail();
    }
  }

  function toBringIngredients() {
    var n = 0;
    var ings = [];
    groupItems().forEach(function (g) {
      g.items.forEach(function (it) {
        if (it.done) return;
        n += 1;
        var num = n < 10 ? "0" + n : String(n);
        ings.push(num + " " + it.name);
      });
    });
    return ings;
  }

  function toBringText() {
    var ings = toBringIngredients();
    if (!ings.length) return "";
    return "Einkauf " + currentStore().name + "\n\n" + ings.join("\n") + "\n";
  }

  function copyBringText(text, okMsg) {
    function fail() { setStatus("Konnte nicht kopieren."); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus(okMsg);
      }).catch(fail);
    } else {
      fail();
    }
  }

  function utf8ToB64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function shareBring() {
    var ings = toBringIngredients();
    if (!ings.length) {
      setStatus("Nichts Offenes zum Mitnehmen.");
      return;
    }
    var store = currentStore();
    var title = "Einkauf " + store.name;
    var recipe = {
      "@context": "https://schema.org",
      "@type": "Recipe",
      name: title,
      author: { "@type": "Person", name: "supervised-info" },
      recipeIngredient: ings
    };
    var html = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title></title>" +
      "<script type=\"application/ld+json\">" +
      JSON.stringify(recipe).replace(/</g, "\\u003c") +
      "</scr" + "ipt></head><body></body></html>";
    var src = "https://httpbin.org/base64/" + utf8ToB64(html);
    var href = "https://api.getbring.com/rest/bringrecipes/deeplink?url=" +
      encodeURIComponent(src) + "&source=web&baseQuantity=1&requestedQuantity=1";
    if (href.length > 7500) {
      copyBringText(toBringText(), "Liste zu lang für den Bring-Link. Kopiert.");
      return;
    }
    setStatus("Öffnet Bring…");
    var a = document.createElement("a");
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function shareMd() {
    if (!navigator.share) return;
    var store = currentStore();
    var md = toMarkdown();
    navigator.share({ title: "Einkauf — " + store.name, text: md }).then(function () {
      setStatus("Geteilt.");
    }).catch(function (err) {
      if (err && err.name === "AbortError") return;
      setStatus("Teilen nicht möglich.");
    });
  }

  function downloadMd() {
    var store = currentStore();
    var md = toMarkdown();
    var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    var a = document.createElement("a");
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = "einkauf-" + slugify(store.name) + ".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    setStatus("Datei gespeichert.");
  }

  function openSheet() {
    if (sheetOpen) return;
    sheetOpen = true;
    els.sheet.hidden = false;
    els.scrim.hidden = false;
    els.layoutBtn.setAttribute("aria-expanded", "true");
    document.body.classList.add("locked");
    renderSheet();
    requestAnimationFrame(function () {
      els.sheet.classList.add("open");
      els.scrim.classList.add("open");
    });
    els.sheetClose.focus();
  }

  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    els.sheet.classList.remove("open");
    els.scrim.classList.remove("open");
    els.layoutBtn.setAttribute("aria-expanded", "false");
    document.body.classList.remove("locked");
    clearTimeout(sheetCloser);
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var done = function () {
      els.sheet.hidden = true;
      els.scrim.hidden = true;
      els.layoutBtn.focus();
    };
    if (reduce) done();
    else sheetCloser = setTimeout(done, 230);
  }

  function renderSheet() {
    var store = currentStore();
    els.sheetStore.textContent = store.name;
    els.layoutList.textContent = "";
    store.layout.forEach(function (id, idx) {
      var li = document.createElement("li");
      li.className = "layout-row";
      var nm = document.createElement("span");
      nm.className = "layout-name";
      nm.textContent = DEPTS[id] || id;
      var btns = document.createElement("div");
      btns.className = "layout-btns";

      var up = document.createElement("button");
      up.type = "button";
      up.textContent = "Nach oben";
      up.disabled = idx === 0;
      up.addEventListener("click", function () { moveDept(idx, -1); });

      var down = document.createElement("button");
      down.type = "button";
      down.textContent = "Nach unten";
      down.disabled = idx === store.layout.length - 1;
      down.addEventListener("click", function () { moveDept(idx, 1); });

      var rm = document.createElement("button");
      rm.type = "button";
      rm.textContent = "Entfernen";
      rm.disabled = store.layout.length <= 1;
      rm.addEventListener("click", function () { removeDept(id); });

      btns.appendChild(up);
      btns.appendChild(down);
      btns.appendChild(rm);
      li.appendChild(nm);
      li.appendChild(btns);
      els.layoutList.appendChild(li);
    });

    els.unused.textContent = "";
    var unusedCount = 0;
    Object.keys(DEPTS).forEach(function (d) {
      if (store.layout.indexOf(d) !== -1) return;
      unusedCount += 1;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = DEPTS[d];
      b.addEventListener("click", function () { addDeptToLayout(d); });
      els.unused.appendChild(b);
    });
    if (!unusedCount) {
      var p = document.createElement("p");
      p.className = "hint";
      p.textContent = "Alle Abteilungen sind im Layout.";
      els.unused.appendChild(p);
    }

    els.resetBtn.hidden = !store.builtin;
    els.deleteBtn.hidden = !!store.builtin;
  }

  function moveDept(idx, dir) {
    var store = currentStore();
    var j = idx + dir;
    if (j < 0 || j >= store.layout.length) return;
    var t = store.layout[idx];
    store.layout[idx] = store.layout[j];
    store.layout[j] = t;
    scheduleSave();
    renderList();
    renderSheet();
  }

  function addDeptToLayout(id) {
    var store = currentStore();
    if (!DEPTS[id] || store.layout.indexOf(id) !== -1) return;
    store.layout.push(id);
    scheduleSave();
    renderList();
    renderSheet();
  }

  function removeDept(id) {
    var store = currentStore();
    if (store.layout.length <= 1) return;
    store.layout = store.layout.filter(function (d) { return d !== id; });
    if (!store.layout.length) store.layout.push("sonstiges");
    scheduleSave();
    renderList();
    renderSheet();
  }

  function resetLayout() {
    var store = currentStore();
    var seed = null;
    SEEDS.forEach(function (s) { if (s.id === store.id) seed = s; });
    if (!seed) return;
    store.layout = seed.layout.slice();
    scheduleSave();
    renderList();
    renderSheet();
    setStatus("Layout zurückgesetzt.");
  }

  function createStore() {
    var name = String(els.newName.value || "").replace(/\s+/g, " ").trim();
    if (!name) {
      setStatus("Bitte einen Namen eingeben.");
      els.newName.focus();
      return;
    }
    var id = uid("s");
    state.stores.push({
      id: id,
      name: name,
      layout: currentStore().layout.slice(),
      builtin: false
    });
    state.currentStoreId = id;
    els.newName.value = "";
    scheduleSave();
    renderStoreSelect();
    renderList();
    renderSheet();
    setStatus("Laden angelegt.");
  }

  function deleteStore() {
    var store = currentStore();
    if (store.builtin) return;
    if (!window.confirm("Laden „" + store.name + "“ wirklich löschen?")) return;
    state.stores = state.stores.filter(function (s) { return s.id !== store.id; });
    if (!state.stores.length) state.stores = seedStores();
    state.currentStoreId = state.stores[0].id;
    scheduleSave();
    renderStoreSelect();
    renderList();
    renderSheet();
    setStatus("Laden gelöscht.");
  }
})();
</script>
</body>
</html>
